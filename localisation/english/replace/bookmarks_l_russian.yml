 GATHERING_STORM_NAME: "World War"
 GATHERING_STORM_DESC: "This scenario covers the full scope of the Second World War, featuring battles across every major front on a truly global scale. Take part in the defining military campaigns of the conflict, from the Western and Eastern Fronts to the deserts of Africa and the Pacific Ocean, fighting for supremacy on land, at sea and in the air. Reworked economy, country balance, land combat and naval warfare make historical multiplayer games more consistent, competitive and driven by players' decisions."
