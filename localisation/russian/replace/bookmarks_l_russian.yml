l_russian:
 GATHERING_STORM_NAME: "Мировая война"
 GATHERING_STORM_DESC: "Этот режим охватывает весь спектр событий Второй мировой войны, сражения на всех фронтах и глобальными масштабами. Игроки смогут участвовать в ключевых военных операциях, от Западного фронта до Восточного, от африканских пустынь до Тихого океана, сражаясь за господство на суше, в воздухе и на море. Переработанные экономика, баланс государств, сухопутные сражения и военно-морская система делают исторические партии более последовательными, соревновательными и зависящими от решений игроков."
